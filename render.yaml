# Blueprint Render — backend NestJS + PostgreSQL, hébergés en UE (Frankfurt).
# Création : dashboard Render → New → Blueprint → ce repo. Les variables
# marquées `sync: false` sont demandées à ce moment-là (reprendre EXACTEMENT
# les valeurs de Railway, voir commentaires).
services:
  - type: web
    name: checkin-backend
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    autoDeploy: true
    # Monorepo pnpm : install à la racine (workspaces), build du seul backend.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @horaires/backend build
    # Migrations Prisma appliquées avant chaque mise en ligne, comme sur Railway.
    preDeployCommand: pnpm --filter @horaires/backend exec prisma migrate deploy
    startCommand: node apps/backend/dist/main
    # Seule route publique qui répond 200 sans authentification.
    healthCheckPath: /api-docs
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: checkin-db
          property: connectionString
      # Mêmes valeurs que sur Railway : sinon toutes les sessions (web,
      # mobile) et tablettes appairées sont déconnectées à la bascule.
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_DEVICE_SECRET
        sync: false
      # Même valeur que celle générée pour Railway — une autre clé rendrait
      # illisibles les PIN déjà chiffrés en base (voir CLAUDE.md #29).
      - key: PIN_ENCRYPTION_KEY
        sync: false
      - key: GEOCODING_CONTACT_EMAIL
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: JWT_DEVICE_EXPIRES_IN
        value: 12h

databases:
  - name: checkin-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: horaires_app
    user: horaires
